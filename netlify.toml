[build]
  command = "npm run build && npm run check"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/v2"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/v2/*"
  to = "/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/contact"
  to = "/enquiry"
  status = 301

# Every real page is emitted by the build. Unknown URLs must not become soft 404s.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/assets/optimized/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"

# Fingerprinted bundles can be cached indefinitely; images retain deploy revalidation.
[[headers]]
  for = "/assets/bundles/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
